name: Correction
description: Report a wrong, out-of-date or broken record
labels: [correction]
body:
  - type: input
    id: record
    attributes: { label: Record id or page, placeholder: "e.g. lwetb-0052" }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: "What is wrong, and what is the correct information?" }
    validations: { required: true }
  - type: input
    id: source
    attributes: { label: Source link that confirms the correction }
